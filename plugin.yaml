name: telegram-topic-only
version: "0.2.0"
description: Silently drop root messages in one Telegram private chat before Hermes dispatch.
config_schema:
  chat_id:
    type: str
    required: true
    description: Positive Telegram private chat ID to protect (not a thread ID).
  root_allowlist:
    type: array
    items: {type: string}
    default: []
    description: Exact, case-sensitive text or slash commands to pass through in the root DM.